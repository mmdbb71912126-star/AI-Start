    .modal {

    .range-row span { font-size: 13px; color: #b0b6c3; min-width: 32px; }

    /* 运行预览 */
    .run-modal {

      display: none; flex-direction: column; z-index: 1001;

    .run-modal.show { display: flex; }
    .run-bar {
      background: #151821;

    /* 会话菜单 */
    .conv-menu {

    /* ===== 移动端 ===== */

  </style>
</head>

<!-- ===== iOS 图标生成 ===== -->
<script>
(function () {
  function rr(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function draw(size, padRatio) {
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const ctx = c.getContext('2d');
    const pad = size * (padRatio || 0);
    const inner = size - pad * 2;
    const s = inner / 128;
    ctx.fillStyle = '#151821';
    ctx.fillRect(0, 0, size, size);
    ctx.save();
    ctx.translate(pad, pad);
    const g = ctx.createLinearGradient(0, 0, inner, inner);
    g.addColorStop(0, '#6f9bff'); g.addColorStop(1, '#4f7cff');
    rr(ctx, 24 * s, 34 * s, 80 * s, 52 * s, 14 * s);
    ctx.fillStyle = g; ctx.fill();
    ctx.beginPath();
    ctx.moveTo(52 * s, 86 * s); ctx.lineTo(52 * s, 104 * s); ctx.lineTo(74 * s, 86 * s);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#fff';
    for (const x of [48, 64, 80]) {
      ctx.beginPath(); ctx.arc(x * s, 60 * s, 6 * s, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
    return c.toDataURL('image/png');
  }
  const png180 = draw(180, 0);
  const png192 = draw(192, 0.08);
  const png512 = draw(512, 0.08);
  const head = document.head;
  const add = (rel, href, sizes) => {
    const l = document.createElement('link');
    l.rel = rel; if (sizes) l.sizes = sizes; l.href = href;
    head.appendChild(l);
  };
  add('apple-touch-icon', png180, '180x180');
  add('icon', png192, '192x192');
  const manifest = {
    name: 'AI 聊天', short_name: 'AI 聊天',
    start_url: location.href,
    scope: location.href.replace(/[^/]*$/, ''),
    display: 'standalone',
    background_color: '#0f1117', theme_color: '#151821',
    icons: [
      { src: png192, sizes: '192x192', type: 'image/png', purpose: 'any' },
      { src: png512, sizes: '512x512', type: 'image/png', purpose: 'any' }
    ]
  };
  add('manifest', URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' })));
})();
</script>

    <h2>设置</h2>
    <label>OpenRouter API Key
      <input type="password" id="gs-key" placeholder="sk-or-v1-..." autocomplete="off">
    </label>
    <div class="checkbox-row">
      <input type="checkbox" id="gs-remember-key">
      <label for="gs-remember-key" style="margin:0;cursor:pointer">记住 Key（保存在本浏览器）</label>
    </div>
    <label>温度（越高越有创意）
      <div class="range-row">
        <input type="range" id="gs-temp" min="0" max="2" step="0.1" value="0.7">
        <span id="gs-temp-val">0.7</span>
      </div>
    </label>
    <label>最大输出 tokens（0 = 默认）
      <input type="number" id="gs-maxtokens" min="0" max="200000" step="100" value="0">
    </label>
    <div class="modal-actions">
      <button id="gs-clear-all" class="danger">清空所有数据</button>
      <button id="gs-cancel">取消</button>
      <button id="gs-save" class="primary">保存</button>
    </div>
  </div>
</div>

<!-- ===== 运行预览 ===== -->
<div class="run-modal" id="run-modal">
  <div class="run-bar">
    <span>运行预览</span>
    <span class="tag" id="run-tag">HTML</span>
    <span class="spacer"></span>
    <button id="run-reload">重新加载</button>
    <button id="run-close">关闭</button>
  </div>
  <iframe id="run-frame" sandbox="allow-scripts allow-forms allow-modals allow-popups allow-pointer-lock"></iframe>
</div>

<script>
(() => {
  'use strict';

  // ============ 常量 ============
  const API_URL = 'https://openrouter.ai/api/v1/chat/completions';
  const RENDER_INTERVAL = 80;
  const LS = {
    KEY: 'aic_api_key',
    SETTINGS: 'aic_settings',
    CONVS: 'aic_convs',
    CURRENT: 'aic_current_conv',
  };

  // ============ 元素引用 ============
  const $ = id => document.getElementById(id);
  const $sidebar = $('sidebar');
  const $sidebarBackdrop = $('sidebar-backdrop');
  const $convList = $('conv-list');
  const $messages = $('messages');
  const $input = $('input');
  const $sendBtn = $('send-btn');
  const $model = $('model');
  const $convTitle = $('conv-title');
  const $runModal = $('run-modal');
  const $runFrame = $('run-frame');
  const $runTag = $('run-tag');

  // ============ 状态 ============
  let convs = [];
  let currentId = '';
  let settings = { temperature: 0.7, maxTokens: 0 };
  let apiKey = '';
  let streaming = null;   // { convId, assistantDiv, contentEl, renderer, abortController }
  let convMenu = null;

  // ============ 存储 ============
  function loadAll() {
    try { convs = JSON.parse(localStorage.getItem(LS.CONVS) || '[]'); } catch { convs = []; }
    try { settings = { temperature: 0.7, maxTokens: 0, ...(JSON.parse(localStorage.getItem(LS.SETTINGS) || '{}')) }; } catch {}
    currentId = localStorage.getItem(LS.CURRENT) || '';
    apiKey = localStorage.getItem(LS.KEY) || '';
  }
  function saveConvs() {
    try { localStorage.setItem(LS.CONVS, JSON.stringify(convs)); }
    catch (e) { alert('存储空间不足，请清理部分旧对话'); }
  }
  function saveSettings() {
    localStorage.setItem(LS.SETTINGS, JSON.stringify(settings));
  }
  function saveKey() {
    if (apiKey) localStorage.setItem(LS.KEY, apiKey);
    else localStorage.removeItem(LS.KEY);
  }
  function saveCurrent() { localStorage.setItem(LS.CURRENT, currentId); }

  // ============ 工具 ============
  const uid = () => 'c_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const getCurrent = () => convs.find(c => c.id === currentId) || null;
  const escapeHtml = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function scrollBottom() { $messages.scrollTop = $messages.scrollHeight; }

  function tsStamp() {
    const d = new Date(), p = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
  }

  // ============ Markdown / 高亮 ============
  if (window.marked) marked.setOptions({ gfm: true, breaks: true });

  function renderMarkdown(container, text) {
    if (!window.marked) { container.textContent = text; return; }
    const html = marked.parse(text);
    const safe = window.DOMPurify ? DOMPurify.sanitize(html, { ADD_ATTR: ['target'] }) : html;
    container.innerHTML = safe;
    container.querySelectorAll('a').forEach(a => {
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
    });
  }

  function highlightAll(container) {
    if (!window.hljs) return;
    container.querySelectorAll('pre code').forEach(el => {
      try { delete el.dataset.highlighted; hljs.highlightElement(el); } catch {}
    });
  }

  // ============ 语言 / 后缀检测 ============
  const EXT_MAP = {
    python:'py', py:'py', python3:'py',
    javascript:'js', js:'js', jsx:'jsx', node:'js', nodejs:'js', mjs:'mjs', cjs:'cjs',
    typescript:'ts', ts:'ts', tsx:'tsx',
    html:'html', htm:'html', xhtml:'xhtml',
    css:'css', scss:'scss', sass:'sass', less:'less',
    svg:'svg', xml:'xml',
    json:'json', json5:'json5', jsonc:'jsonc',
    yaml:'yml', yml:'yml',
    markdown:'md', md:'md',
    shell:'sh', sh:'sh', bash:'sh', zsh:'sh', fish:'fish',
    powershell:'ps1', ps1:'ps1', pwsh:'ps1',
    cmd:'bat', bat:'bat', batch:'bat',
    c:'c', h:'h',
    cpp:'cpp', 'c++':'cpp', cc:'cpp', cxx:'cpp', hpp:'hpp',
    csharp:'cs', cs:'cs', 'c#':'cs',
    java:'java', kotlin:'kt', kt:'kt', kts:'kts',
    go:'go', golang:'go', rust:'rs', rs:'rs',
    ruby:'rb', rb:'rb', php:'php', swift:'swift', dart:'dart',
    scala:'scala', lua:'lua', r:'r', sql:'sql',
    perl:'pl', pl:'pl', elixir:'ex', ex:'ex', exs:'exs',
    erlang:'erl', erl:'erl', haskell:'hs', hs:'hs',
    clojure:'clj', clj:'clj', cljs:'cljs',
    dockerfile:'Dockerfile', docker:'Dockerfile',
    makefile:'Makefile', make:'Makefile',
    nginx:'conf', ini:'ini', toml:'toml', conf:'conf', env:'env',
    plaintext:'txt', text:'txt', txt:'txt', plain:'txt',
  };

  function detectLang(codeEl) {
    const cls = codeEl.className || '';
    let m = cls.match(/(?:^|\s)language-([\w+#.\-]+)/i) || cls.match(/(?:^|\s)lang-([\w+#.\-]+)/i);
    if (m) return m[1].toLowerCase();
    if (codeEl.result && codeEl.result.language) return codeEl.result.language.toLowerCase();
    return '';
  }
  const langToExt = lang => !lang ? 'txt' : (EXT_MAP[lang] || lang.replace(/[^\w+#\-]/g, ''));

  function detectRunnableKind(lang, code) {
    const l = (lang || '').toLowerCase();
    if (l === 'html' || l === 'htm' || l === 'xhtml') return 'html';
    if (l === 'svg') return 'svg';
    const t = code.trim();
    if (/^<svg[\s>]/i.test(t)) return 'svg';
    if (/^<!doctype\s+html/i.test(t) || /^<html[\s>]/i.test(t)) return 'html';
    return null;
  }

  function mimeForExt(ext) {
    switch (ext.toLowerCase()) {
      case 'html': case 'htm': return 'text/html';
      case 'svg': return 'image/svg+xml';
      case 'xml': return 'application/xml';
      case 'json': return 'application/json';
      case 'css': return 'text/css';
      case 'js': case 'mjs': case 'cjs': return 'text/javascript';
      case 'ts': return 'text/typescript';
      default: return 'text/plain';
    }
  }

  // ============ 复制 / 下载 ============
  async function copyText(text) {
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        return true;
      }
    } catch {}
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.top = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch {}
    document.body.removeChild(ta);
    return ok;
  }

  function downloadText(filename, text, mime) {
    const blob = new Blob([text], { type: (mime || 'text/plain') + ';charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  // ============ 运行预览 ============
  let currentRunUrl = null;
  function runCode(code, kind) {
    let html;
    if (kind === 'svg') {
      const t = code.trim();
      if (/^<!doctype\s+html/i.test(t) || /^<html[\s>]/i.test(t)) html = code;
      else html = `<!DOCTYPE html><html><head><meta charset="utf-8">
<style>html,body{margin:0;height:100%;display:flex;align-items:center;justify-content:center;background:#fff;}</style>
</head><body>${code}</body></html>`;
    } else html = code;

    if (currentRunUrl) { URL.revokeObjectURL(currentRunUrl); currentRunUrl = null; }
    const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
    currentRunUrl = URL.createObjectURL(blob);
    $runTag.textContent = kind.toUpperCase();
    $runFrame.src = currentRunUrl;
    $runModal.classList.add('show');
  }
  function closeRun() {
    $runModal.classList.remove('show');
    $runFrame.src = 'about:blank';
    if (currentRunUrl) { URL.revokeObjectURL(currentRunUrl); currentRunUrl = null; }
  }
  $('run-close').onclick = closeRun;
  $('run-reload').onclick = () => {
    const src = $runFrame.src;
    $runFrame.src = 'about:blank';
    setTimeout(() => { $runFrame.src = src; }, 30);
  };
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && $runModal.classList.contains('show')) closeRun();
  });

  // ============ 代码块按钮 ============
  function addCodeActions(container) {
    container.querySelectorAll('pre').forEach(pre => {
      if (pre.querySelector('.code-actions')) return;
      const codeEl = pre.querySelector('code');
      if (!codeEl) return;

      const code = codeEl.textContent;
      const lang = detectLang(codeEl);
      const ext = langToExt(lang);
      const kind = detectRunnableKind(lang, code);

      const actions = document.createElement('div');
      actions.className = 'code-actions';

      const copyBtn = document.createElement('button');
      copyBtn.type = 'button'; copyBtn.className = 'code-btn'; copyBtn.textContent = '复制';
      copyBtn.addEventListener('click', async () => {
        const ok = await copyText(codeEl.textContent);
        copyBtn.textContent = ok ? '已复制' : '失败';
        copyBtn.classList.add(ok ? 'ok' : 'fail');
        setTimeout(() => { copyBtn.textContent = '复制'; copyBtn.classList.remove('ok', 'fail'); }, 1500);
      });
      actions.appendChild(copyBtn);

      const dlBtn = document.createElement('button');
      dlBtn.type = 'button'; dlBtn.className = 'code-btn'; dlBtn.textContent = '下载';
      dlBtn.title = `下载 .${ext}`;
      dlBtn.addEventListener('click', () => {
        downloadText(`snippet-${tsStamp()}.${ext}`, codeEl.textContent, mimeForExt(ext));
      });
      actions.appendChild(dlBtn);

      if (kind) {
        const runBtn = document.createElement('button');
        runBtn.type = 'button'; runBtn.className = 'code-btn run'; runBtn.textContent = '运行';
        runBtn.title = `运行 ${kind.toUpperCase()}`;
        runBtn.addEventListener('click', () => runCode(codeEl.textContent, kind));
        actions.appendChild(runBtn);
      }

      pre.appendChild(actions);
    });
  }

  // ============ 角色扮演 system prompt ============
  function buildSystemPrompt(conv) {
    const rp = conv.roleplay;
    if (!rp || !rp.enabled) return '';
    const parts = [];
    parts.push(`你现在扮演角色「${rp.name || 'AI 助手'}」，请始终以该角色的身份、语气、性格和知识范围回应。`);
    if (rp.personality) parts.push(`【性格】${rp.personality}`);
    if (rp.style) parts.push(`【说话风格】${rp.style}`);
    if (rp.background) parts.push(`【背景设定】${rp.background}`);
    parts.push(`除非用户明确要求，否则不要跳出角色，不要提及自己是 AI 或语言模型，不要描述"作为 AI 我无法……"之类的话。`);
    return parts.join('\n\n');
  }

  // ============ 会话管理 ============
  function createConversation(opts = {}) {
    const rp = opts.roleplay || { enabled: false, name: '', personality: '', style: '', background: '' };
    const conv = {
      id: uid(),
      title: rp.enabled && rp.name ? `与 ${rp.name} 的对话` : '新对话',
      createdAt: Date.now(),
      updatedAt: Date.now(),
      model: $model.value || 'openrouter/free',
      roleplay: { ...rp },
      messages: [],
    };
    convs.unshift(conv);
    currentId = conv.id;
    saveConvs(); saveCurrent();
    renderConvList();
    renderCurrent();
    closeSidebar();
    return conv;
  }

  function switchConversation(id) {
    if (streaming && streaming.convId === id) { closeSidebar(); return; }
    if (streaming) streaming.abortController.abort();
    currentId = id;
    saveCurrent();
    renderConvList();
    renderCurrent();
    closeSidebar();
  }

  function deleteConversation(id) {
    const conv = convs.find(c => c.id === id);
    if (!conv) return;
    if (!confirm(`确定删除对话「${conv.title}」？此操作无法撤销。`)) return;
    if (streaming && streaming.convId === id) streaming.abortController.abort();
    convs = convs.filter(c => c.id !== id);
    if (currentId === id) currentId = convs[0]?.id || '';
    saveConvs(); saveCurrent();
    renderConvList();
    renderCurrent();
  }

  function exportConversation(conv) {
    if (!conv) return;
    const lines = [`# ${conv.title}`, ''];
    lines.push(`> 模型: ${conv.model}`);
    if (conv.roleplay?.enabled) {
      lines.push(`> 角色扮演: ${conv.roleplay.name || 'AI'}`);
      if (conv.roleplay.personality) lines.push(`> 性格: ${conv.roleplay.personality}`);
      if (conv.roleplay.style) lines.push(`> 说话风格: ${conv.roleplay.style}`);
      if (conv.roleplay.background) lines.push(`> 背景设定: ${conv.roleplay.background}`);
    }
    lines.push('', '---', '');
    conv.messages.forEach(m => {
      lines.push(m.role === 'user' ? '## 👤 用户' : '## 🤖 助手');
      lines.push('', m.content, '');
    });
    downloadText(`${conv.title.replace(/[\\/:*?"<>|]/g, '_')}-${tsStamp()}.md`, lines.join('\n'), 'text/markdown');
  }

  // ============ 渲染会话列表 ============
  function renderConvList() {
    $convList.innerHTML = '';
    if (convs.length === 0) {
      $convList.innerHTML = '<div class="empty-tip">还没有对话，点右上角 ＋ 新建</div>';
      return;
    }
    convs.forEach(conv => {
      const item = document.createElement('div');
      item.className = 'conv-item' + (conv.id === currentId ? ' active' : '');

      const title = document.createElement('div');
      title.className = 'conv-item-title';
      title.textContent = (conv.roleplay?.enabled ? '🎭 ' : '') + (conv.title || '新对话');

      const menuBtn = document.createElement('button');
      menuBtn.className = 'conv-item-menu';
      menuBtn.textContent = '⋯';
      menuBtn.title = '更多';
      menuBtn.addEventListener('click', e => {
        e.stopPropagation();
        showConvMenu(conv.id, menuBtn);
      });

      item.appendChild(title);
      item.appendChild(menuBtn);
      item.addEventListener('click', () => {
        if (conv.id !== currentId) switchConversation(conv.id);
        else closeSidebar();
      });

      $convList.appendChild(item);
    });
  }

  // ============ 会话菜单 ============
  function closeConvMenu() {
    if (convMenu) { convMenu.remove(); convMenu = null; }
    document.removeEventListener('mousedown', onGlobalMouseDown, true);
  }
  function onGlobalMouseDown(e) {
    if (convMenu && !convMenu.contains(e.target)) closeConvMenu();
  }
  function showConvMenu(id, anchorEl) {
    closeConvMenu();
    const conv = convs.find(c => c.id === id);
    if (!conv) return;

    const menu = document.createElement('div');
    menu.className = 'conv-menu';
    menu.innerHTML = `
      <button data-a="rename">重命名</button>
      <button data-a="edit">编辑人设</button>
      <button data-a="export">导出 Markdown</button>
      <button data-a="delete" class="danger">删除</button>
    `;

    const rect = anchorEl.getBoundingClientRect();
    menu.style.top = (rect.bottom + 4) + 'px';
    menu.style.left = Math.min(rect.left, window.innerWidth - 160) + 'px';
    document.body.appendChild(menu);
    convMenu = menu;

    menu.addEventListener('click', e => {
      const a = e.target.dataset.a;
      if (!a) return;
      closeConvMenu();
      if (a === 'rename') {
        const t = prompt('输入新标题', conv.title);
        if (t !== null) {
          conv.title = t.trim() || conv.title;
          saveConvs(); renderConvList();
          if (conv.id === currentId) $convTitle.textContent = conv.title;
        }
      } else if (a === 'edit') {
        openConvSettings(conv.id);
      } else if (a === 'export') {
        exportConversation(conv);
      } else if (a === 'delete') {
        deleteConversation(conv.id);
      }
    });

    setTimeout(() => document.addEventListener('mousedown', onGlobalMouseDown, true), 0);
  }

  // ============ 渲染当前会话 ============
  function renderCurrent() {
    $messages.innerHTML = '';
    const conv = getCurrent();

    if (!conv) {
      $convTitle.textContent = '新对话';
      $messages.innerHTML = '<div class="empty-tip" style="text-align:center;padding:60px 20px;">还没有对话，点击左上角 ☰ → ＋ 新建对话</div>';
      return;
    }

    $convTitle.textContent = conv.title;
    $model.value = conv.model || 'openrouter/free';

    if (conv.roleplay?.enabled) {
      const banner = document.createElement('div');
      banner.className = 'roleplay-banner';
      banner.innerHTML = `🎭 角色扮演：<b>${escapeHtml(conv.roleplay.name || 'AI')}</b>`;
      $messages.appendChild(banner);
    }

    conv.messages.forEach(m => appendMessageDOM(m));
    scrollBottom();
  }

  function appendMessageDOM(msg) {
    const div = document.createElement('div');
    div.className = `msg ${msg.role}`;

    if (msg.role === 'assistant') {
      const label = document.createElement('div');
      label.className = 'label';
      label.textContent = '助手';
      div.appendChild(label);

      const md = document.createElement('div');
      md.className = 'md';
      div.appendChild(md);
      $messages.appendChild(div);
      renderMarkdown(md, msg.content);
      addCodeActions(md);
      highlightAll(md);
    } else {
      div.textContent = msg.content;
      $messages.appendChild(div);
    }
    scrollBottom();
    return div;
  }

  // ============ 流式渲染 ============
  function makeRenderer(contentEl) {
    let last = 0, timer = null, full = '';
    const doRender = () => { renderMarkdown(contentEl, full); scrollBottom(); };
    return {
      setText(t) { full = t; },
      schedule() {
        const now = performance.now();
        const remain = RENDER_INTERVAL - (now - last);
        if (remain <= 0) {
          if (timer) { clearTimeout(timer); timer = null; }
          last = now; doRender();
        } else if (!timer) {
          timer = setTimeout(() => { timer = null; last = performance.now(); doRender(); }, remain);
        }
      },
      flush() { if (timer) { clearTimeout(timer); timer = null; } doRender(); },
      get text() { return full; },
    };
  }

  function setStreamingUI(on) {
    $sendBtn.disabled = on;
    $sendBtn.textContent = on ? '停止' : '发送';
    $sendBtn.onclick = on ? () => streaming?.abortController.abort() : send;
  }

  // ============ 发送 ============
  async function send() {
    const conv = getCurrent();
    if (!conv || streaming) return;

    if (!apiKey) {
      alert('请先在设置里填入 OpenRouter API Key');
      openGlobalSettings();
      return;
    }

    const text = $input.value.trim();
    if (!text) return;

    $input.value = '';
    $input.style.height = '44px';
    $input.focus();

    conv.messages.push({ role: 'user', content: text });
    conv.updatedAt = Date.now();
    if (conv.title === '新对话') {
      conv.title = text.slice(0, 24) + (text.length > 24 ? '…' : '');
      $convTitle.textContent = conv.title;
    }
    saveConvs();
    renderConvList();
    appendMessageDOM({ role: 'user', content: text });

    // 准备 assistant 容器
    const assistantDiv = document.createElement('div');
    assistantDiv.className = 'msg assistant';
    const label = document.createElement('div');
    label.className = 'label'; label.textContent = '助手';
    assistantDiv.appendChild(label);
    const contentEl = document.createElement('div');
    contentEl.className = 'md streaming';
    assistantDiv.appendChild(contentEl);
    $messages.appendChild(assistantDiv);
    scrollBottom();

    const renderer = makeRenderer(contentEl);
    const abortController = new AbortController();
    streaming = { convId: conv.id, assistantDiv, contentEl, renderer, abortController };
    setStreamingUI(true);

    let wasAborted = false;

    try {
      const sys = buildSystemPrompt(conv);
      const messagesForAPI = [];
      if (sys) messagesForAPI.push({ role: 'system', content: sys });
      messagesForAPI.push(...conv.messages);

      const body = {
        model: conv.model || 'openrouter/free',
        messages: messagesForAPI,
        stream: true,
        temperature: settings.temperature ?? 0.7,
      };
      if (settings.maxTokens > 0) body.max_tokens = settings.maxTokens;

      const response = await fetch(API_URL, {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${apiKey}`,
          'Content-Type': 'application/json',
        },
        body: JSON.stringify(body),
        signal: abortController.signal,
      });

      if (!response.ok) {
        const errText = await response.text();
        throw new Error(`HTTP ${response.status}: ${errText.slice(0, 300)}`);
      }

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });

        let idx;
        while ((idx = buffer.indexOf('\n')) !== -1) {
          const line = buffer.slice(0, idx).trim();
          buffer = buffer.slice(idx + 1);
          if (!line || line.startsWith(':')) continue;
          if (!line.startsWith('data: ')) continue;
          const data = line.slice(6);
          if (data === '[DONE]') continue;
          try {
            const parsed = JSON.parse(data);
            const delta = parsed.choices?.[0]?.delta?.content;
            if (delta) {
              renderer.setText(renderer.text + delta);
              renderer.schedule();
            }
          } catch {}
        }
      }
    } catch (err) {
      if (err.name === 'AbortError') {
        wasAborted = true;
      } else {
        assistantDiv.classList.add('error');
        contentEl.textContent = `请求失败：${err.message}`;
        contentEl.classList.remove('streaming');
        streaming = null;
        setStreamingUI(false);
        return;
      }
    } finally {
      contentEl.classList.remove('streaming');
      if (renderer.text) {
        renderer.flush();
        addCodeActions(contentEl);
        highlightAll(contentEl);
        const targetConv = convs.find(c => c.id === (streaming?.convId || conv.id));
        if (targetConv) {
          let finalContent = renderer.text;
          if (wasAborted) finalContent += '\n\n*（已停止）*';
          targetConv.messages.push({ role: 'assistant', content: finalContent });
          targetConv.updatedAt = Date.now();
          saveConvs();
        }
      } else if (wasAborted && !assistantDiv.textContent.trim()) {
        assistantDiv.remove();
      }
      streaming = null;
      setStreamingUI(false);
      $input.focus();
    }
  }

  // ============ 新建对话模态框 ============
  let ncMode = 'normal';
  function openNewChat() {
    ncMode = 'normal';
    $('nc-rp-name').value = '';
    $('nc-rp-personality').value = '';
    $('nc-rp-style').value = '';
    $('nc-rp-background').value = '';
    updateNcModeUI();
    $('new-chat-modal').classList.add('show');
    closeSidebar();
  }
  function updateNcModeUI() {
    document.querySelectorAll('#nc-tabs .tab').forEach(t => t.classList.toggle('active', t.dataset.mode === ncMode));
    $('nc-roleplay-form').style.display = ncMode === 'roleplay' ? 'block' : 'none';
  }
  document.querySelectorAll('#nc-tabs .tab').forEach(t => {
    t.addEventListener('click', () => { ncMode = t.dataset.mode; updateNcModeUI(); });
  });
  $('nc-cancel').onclick = () => $('new-chat-modal').classList.remove('show');
  $('nc-confirm').onclick = () => {
    const opts = {};
    if (ncMode === 'roleplay') {
      opts.roleplay = {
        enabled: true,
        name: $('nc-rp-name').value.trim(),
        personality: $('nc-rp-personality').value.trim(),
        style: $('nc-rp-style').value.trim(),
        background: $('nc-rp-background').value.trim(),
      };
    }
    $('new-chat-modal').classList.remove('show');
    createConversation(opts);
  };

  // ============ 对话设置（编辑人设） ============
  let csTargetId = '';
  let csMode = 'normal';
  function openConvSettings(id) {
    const conv = convs.find(c => c.id === id);
    if (!conv) return;
    csTargetId = id;
    csMode = conv.roleplay?.enabled ? 'roleplay' : 'normal';
    $('cs-title').value = conv.title;
    $('cs-rp-name').value = conv.roleplay?.name || '';
    $('cs-rp-personality').value = conv.roleplay?.personality || '';
    $('cs-rp-style').value = conv.roleplay?.style || '';
    $('cs-rp-background').value = conv.roleplay?.background || '';
    updateCsModeUI();
    $('conv-settings-modal').classList.add('show');
  }
  function updateCsModeUI() {
    document.querySelectorAll('#cs-tabs .tab').forEach(t => t.classList.toggle('active', t.dataset.mode === csMode));
    $('cs-roleplay-form').style.display = csMode === 'roleplay' ? 'block' : 'none';
  }
  document.querySelectorAll('#cs-tabs .tab').forEach(t => {
    t.addEventListener('click', () => { csMode = t.dataset.mode; updateCsModeUI(); });
  });
  $('cs-cancel').onclick = () => $('conv-settings-modal').classList.remove('show');
  $('cs-save').onclick = () => {
    const conv = convs.find(c => c.id === csTargetId);
    if (!conv) return;
    conv.title = $('cs-title').value.trim() || conv.title;
    if (csMode === 'roleplay') {
      conv.roleplay = {
        enabled: true,
        name: $('cs-rp-name').value.trim(),
        personality: $('cs-rp-personality').value.trim(),
        style: $('cs-rp-style').value.trim(),
        background: $('cs-rp-background').value.trim(),
      };
    } else {
      conv.roleplay = { enabled: false, name: '', personality: '', style: '', background: '' };
    }
    saveConvs();
    renderConvList();
    if (conv.id === currentId) renderCurrent();
    $('conv-settings-modal').classList.remove('show');
  };

  // ============ 全局设置 ============
  function openGlobalSettings() {
    $('gs-key').value = apiKey;
    $('gs-remember-key').checked = !!localStorage.getItem(LS.KEY);
    $('gs-temp').value = settings.temperature ?? 0.7;
    $('gs-temp-val').textContent = (settings.temperature ?? 0.7).toFixed(1);
    $('gs-maxtokens').value = settings.maxTokens || 0;
    $('global-settings-modal').classList.add('show');
  }
  $('gs-temp').addEventListener('input', () => {
    $('gs-temp-val').textContent = parseFloat($('gs-temp').value).toFixed(1);
  });
  $('gs-cancel').onclick = () => $('global-settings-modal').classList.remove('show');
  $('gs-save').onclick = () => {
    apiKey = $('gs-key').value.trim();
    if ($('gs-remember-key').checked) localStorage.setItem(LS.KEY, apiKey);
    else localStorage.removeItem(LS.KEY);
    settings.temperature = parseFloat($('gs-temp').value) || 0;
    settings.maxTokens = parseInt($('gs-maxtokens').value, 10) || 0;
    saveSettings();
    $('global-settings-modal').classList.remove('show');
  };
  $('gs-clear-all').onclick = () => {
    if (!confirm('确定清空所有数据（所有对话、设置、API Key）？此操作无法撤销。')) return;
    localStorage.removeItem(LS.CONVS);
    localStorage.removeItem(LS.SETTINGS);
    localStorage.removeItem(LS.KEY);
    localStorage.removeItem(LS.CURRENT);
    convs = []; currentId = ''; settings = { temperature: 0.7, maxTokens: 0 }; apiKey = '';
    renderConvList(); renderCurrent();
    $('global-settings-modal').classList.remove('show');
  };

  // ============ 侧边栏 ============
  function openSidebar() {
    $sidebar.classList.add('open');
    $sidebarBackdrop.classList.add('show');
  }
  function closeSidebar() {
    $sidebar.classList.remove('open');
    $sidebarBackdrop.classList.remove('show');
  }
  $('menu-btn').onclick = openSidebar;
  $sidebarBackdrop.onclick = closeSidebar;

  // ============ 顶部按钮 ============
  $('new-chat-btn').onclick = openNewChat;
  $('settings-btn').onclick = openGlobalSettings;
  $('conv-settings-btn').onclick = () => {
    const conv = getCurrent();
    if (!conv) { alert('请先新建对话'); return; }
    openConvSettings(conv.id);
  };
  $model.addEventListener('change', () => {
    const conv = getCurrent();
    if (conv) { conv.model = $model.value; saveConvs(); }
  });

  // ============ 输入交互 ============
  $input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      if (!$sendBtn.disabled) send();
    }
  });
  $input.addEventListener('input', () => {
    $input.style.height = 'auto';
    $input.style.height = Math.min($input.scrollHeight, 120) + 'px';
  });
  $sendBtn.onclick = send;

  // ============ 初始化 ============
  loadAll();

  // 兼容旧数据
  convs.forEach(c => {
    if (!c.roleplay) c.roleplay = { enabled: false, name: '', personality: '', style: '', background: '' };
    if (!c.model) c.model = 'openrouter/free';
  });

  if (!currentId || !convs.find(c => c.id === currentId)) {
    if (convs.length > 0) currentId = convs[0].id;
  }

  renderConvList();
  renderCurrent();
  saveCurrent();

  // 首次打开无 Key，自动弹设置
  if (!apiKey) {
    setTimeout(openGlobalSettings, 300);
  }

  // 焦点
  if (apiKey) $input.focus();
})();
</script>
</body>
</html>
