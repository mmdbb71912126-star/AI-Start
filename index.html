    .md th, .md td { border: 1px solid #2a2d35; padding: 6px 10px; }

    .md hr { border: none; border-top: 1px solid #2a2d35; margin: 1em 0; }

    .code-actions {

    .code-btn.run { background: #2f5c3a; color: #d8f5df; }
    .code-btn.run:hover { background: #3a7a4a; }

    .code-btn.fail { background: #7a3a3a; color: #fff; }

    .md.streaming > *:last-child::after,
    .md.streaming:empty::after {
      content: ''; display: inline-block; width: 7px; height: 1em;
      background: #e8eaed; vertical-align: text-bottom; margin-left: 3px;
      animation: blink 1s step-end infinite;

    #input-area {
      padding: 12px calc(16px + env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));

      display: flex; gap: 10px; flex-shrink: 0;

      flex: 1; background: #0f1117; border: 1px solid #2a2d35; border-radius: 10px;

    .modal {

    .modal.show { display: flex; }

    .modal-actions button.danger { background: #7a3a3a; }
    .modal-actions button.danger:hover { background: #9a4a4a; }

    .tabs {
      display: flex; gap: 4px; margin-bottom: 16px;

    .tabs .tab {

    .range-row { display: flex; align-items: center; gap: 10px; margin-top: 6px; }

    .guide-hint {
      font-size: 12px; color: #7c8595; line-height: 1.6;
      background: #10131a; border-left: 3px solid #4f7cff;
      padding: 8px 12px; border-radius: 0 6px 6px 0;
      margin-bottom: 14px;

    #guide-input { min-height: 120px !important; }

    .run-modal {
      position: fixed; inset: 0; background: rgba(0,0,0,0.72);
      display: none; flex-direction: column; z-index: 1001;
    }
    .run-modal.show { display: flex; }
    .run-bar {
      background: #151821;
      padding: calc(10px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) 10px calc(14px + env(safe-area-inset-left));
      display: flex; align-items: center; gap: 10px;
      border-bottom: 1px solid #2a2d35; color: #e8eaed; font-size: 13px;

    .run-bar button {
      background: #2a2d35; border: none; color: #e8eaed; font-size: 12px;
      padding: 5px 12px; border-radius: 6px; cursor: pointer;
    }
    .run-bar button:hover { background: #3a3f4c; }

    .floating-menu {
      position: fixed; background: #1c1f2a; border: 1px solid #2a2d35;

    /* ===== 移动端 ===== */
    @media (max-width: 768px) {
      #sidebar {
        position: fixed; left: 0; top: 0; bottom: 0; z-index: 100;
        transform: translateX(-100%);

    @media (max-width: 600px) {
      input, select, textarea, button { font-size: 16px; }
      .model-select { order: 10; width: 100%; max-width: none; }
      #messages { padding: 14px 12px; }
      .msg-wrap { max-width: 95%; }
      #rp-toolbar { padding: 8px 12px 0; }
      .guide-text { font-size: 12px; }
    }
    body.resizing { user-select: none; cursor: col-resize; }
  </style>
</head>

<script>
(function () {
  function rr(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function draw(size, padRatio) {
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const ctx = c.getContext('2d');
    const pad = size * (padRatio || 0);
    const inner = size - pad * 2;
    const s = inner / 128;
    ctx.fillStyle = '#151821';
    ctx.fillRect(0, 0, size, size);
    ctx.save();
    ctx.translate(pad, pad);
    const g = ctx.createLinearGradient(0, 0, inner, inner);
    g.addColorStop(0, '#6f9bff'); g.addColorStop(1, '#4f7cff');
    rr(ctx, 24 * s, 34 * s, 80 * s, 52 * s, 14 * s);
    ctx.fillStyle = g; ctx.fill();
    ctx.beginPath();
    ctx.moveTo(52 * s, 86 * s); ctx.lineTo(52 * s, 104 * s); ctx.lineTo(74 * s, 86 * s);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#fff';
    for (const x of [48, 64, 80]) {
      ctx.beginPath(); ctx.arc(x * s, 60 * s, 6 * s, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
    return c.toDataURL('image/png');
  }
  const png180 = draw(180, 0), png192 = draw(192, 0.08), png512 = draw(512, 0.08);
  const head = document.head;
  const add = (rel, href, sizes) => {
    const l = document.createElement('link');
    l.rel = rel; if (sizes) l.sizes = sizes; l.href = href;
    head.appendChild(l);
  };
  add('apple-touch-icon', png180, '180x180');
  add('icon', png192, '192x192');
  const manifest = {
    name: 'AI 聊天', short_name: 'AI 聊天',
    start_url: location.href,
    scope: location.href.replace(/[^/]*$/, ''),
    display: 'standalone',
    background_color: '#0f1117', theme_color: '#151821',
    icons: [
      { src: png192, sizes: '192x192', type: 'image/png', purpose: 'any' },
      { src: png512, sizes: '512x512', type: 'image/png', purpose: 'any' }
    ]
  };
  add('manifest', URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' })));
})();
</script>

<script>
(() => {
  'use strict';

  const API_URL = 'https://openrouter.ai/api/v1/chat/completions';
  const RENDER_INTERVAL = 80;
  const LS = {
    KEY: 'aic_api_key',
    SETTINGS: 'aic_settings',
    CONVS: 'aic_convs',
    CURRENT: 'aic_current_conv',
    SIDEBAR_W: 'aic_sidebar_w',
  };

  const $ = id => document.getElementById(id);
  const $sidebar = $('sidebar');
  const $sidebarResizer = $('sidebar-resizer');
  const $sidebarBackdrop = $('sidebar-backdrop');
  const $convList = $('conv-list');
  const $messages = $('messages');
  const $input = $('input');
  const $sendBtn = $('send-btn');
  const $model = $('model');
  const $convTitle = $('conv-title');
  const $runModal = $('run-modal');
  const $runFrame = $('run-frame');
  const $runTag = $('run-tag');
  const $rpToolbar = $('rp-toolbar');
  const $guideBanner = $('guide-banner');
  const $guideText = $('guide-text');
  const $rpGuideBtn = $('rp-guide-btn');

  let convs = [];
  let currentId = '';
  let settings = { temperature: 0.7, maxTokens: 0 };
  let apiKey = '';
  let streaming = null;
  let floatingMenu = null;
  let editMsgTarget = null;
  let guideTargetId = '';

  // ===== 存储 =====
  function loadAll() {
    try { convs = JSON.parse(localStorage.getItem(LS.CONVS) || '[]'); } catch { convs = []; }
    if (!Array.isArray(convs)) convs = [];
    convs.forEach(c => {
      if (!c.id) c.id = uid();
      if (!c.roleplay) c.roleplay = { enabled: false, name: '', personality: '', style: '', background: '' };
      if (typeof c.roleplay.enabled !== 'boolean') c.roleplay.enabled = false;
      if (!c.model) c.model = 'openrouter/free';
      if (!Array.isArray(c.messages)) c.messages = [];
      if (typeof c.pendingGuide !== 'string') c.pendingGuide = '';
      c.messages = c.messages.filter(m => m && m.role && typeof m.content === 'string');
    });
    try { settings = { temperature: 0.7, maxTokens: 0, ...(JSON.parse(localStorage.getItem(LS.SETTINGS) || '{}')) }; } catch {}
    currentId = localStorage.getItem(LS.CURRENT) || '';
    apiKey = localStorage.getItem(LS.KEY) || '';
    const w = parseInt(localStorage.getItem(LS.SIDEBAR_W), 10);
    if (w && w >= 200 && w <= 480) $sidebar.style.width = w + 'px';
  }
  function saveConvs() {
    try { localStorage.setItem(LS.CONVS, JSON.stringify(convs)); }
    catch (e) { alert('存储空间不足，请清理部分旧对话'); }
  }
  function saveSettings() { localStorage.setItem(LS.SETTINGS, JSON.stringify(settings)); }
  function saveCurrent() { localStorage.setItem(LS.CURRENT, currentId); }

  // ===== 工具 =====
  const uid = () => 'c_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const getCurrent = () => convs.find(c => c.id === currentId) || null;
  const getById = id => convs.find(c => c.id === id) || null;
  const escapeHtml = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  function tsStamp() {
    const d = new Date(), p = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
  }

  // ===== 智能滚动 =====
  let userScrolledUp = false;
  $messages.addEventListener('scroll', () => {
    const nearBottom = $messages.scrollHeight - $messages.scrollTop - $messages.clientHeight < 80;
    userScrolledUp = !nearBottom;
  });
  function scrollBottom(force = false) {
    if (force || !userScrolledUp) $messages.scrollTop = $messages.scrollHeight;
  }

  // ===== Markdown =====
  if (window.marked) marked.setOptions({ gfm: true, breaks: true });

  function renderMarkdown(container, text) {
    const src = typeof text === 'string' ? text : '';
    if (!window.marked) { container.textContent = src; return; }
    let html;
    try { html = marked.parse(src); } catch { container.textContent = src; return; }
    const safe = window.DOMPurify ? DOMPurify.sanitize(html, { ADD_ATTR: ['target'] }) : html;
    container.innerHTML = safe;
    container.querySelectorAll('a').forEach(a => {
      a.target = '_blank'; a.rel = 'noopener noreferrer';
    });
  }

  function highlightAll(container) {
    if (!window.hljs) return;
    container.querySelectorAll('pre code').forEach(el => {
      try { delete el.dataset.highlighted; hljs.highlightElement(el); } catch {}
    });
  }

  // ===== 语言检测 =====
  const EXT_MAP = {
    python:'py', py:'py', python3:'py', javascript:'js', js:'js', jsx:'jsx',
    node:'js', nodejs:'js', mjs:'mjs', cjs:'cjs', typescript:'ts', ts:'ts', tsx:'tsx',
    html:'html', htm:'html', xhtml:'xhtml', css:'css', scss:'scss', sass:'sass', less:'less',
    svg:'svg', xml:'xml', json:'json', json5:'json5', jsonc:'jsonc', yaml:'yml', yml:'yml',
    markdown:'md', md:'md', shell:'sh', sh:'sh', bash:'sh', zsh:'sh', fish:'fish',
    powershell:'ps1', ps1:'ps1', pwsh:'ps1', cmd:'bat', bat:'bat', batch:'bat',
    c:'c', h:'h', cpp:'cpp', 'c++':'cpp', cc:'cpp', cxx:'cpp', hpp:'hpp',
    csharp:'cs', cs:'cs', 'c#':'cs', java:'java', kotlin:'kt', kt:'kt', kts:'kts',
    go:'go', golang:'go', rust:'rs', rs:'rs', ruby:'rb', rb:'rb', php:'php',
    swift:'swift', dart:'dart', scala:'scala', lua:'lua', r:'r', sql:'sql',
    perl:'pl', pl:'pl', elixir:'ex', ex:'ex', exs:'exs', erlang:'erl', erl:'erl',
    haskell:'hs', hs:'hs', clojure:'clj', clj:'clj', cljs:'cljs',
    dockerfile:'Dockerfile', docker:'Dockerfile', makefile:'Makefile', make:'Makefile',
    nginx:'conf', ini:'ini', toml:'toml', conf:'conf', env:'env',
    plaintext:'txt', text:'txt', txt:'txt', plain:'txt',
  };
  function detectLang(codeEl) {
    const cls = codeEl.className || '';
    let m = cls.match(/(?:^|\s)language-([\w+#.\-]+)/i) || cls.match(/(?:^|\s)lang-([\w+#.\-]+)/i);
    if (m) return m[1].toLowerCase();
    if (codeEl.result && codeEl.result.language) return codeEl.result.language.toLowerCase();
    return '';
  }
  const langToExt = lang => !lang ? 'txt' : (EXT_MAP[lang] || lang.replace(/[^\w+#\-]/g, ''));
  function detectRunnableKind(lang, code) {
    const l = (lang || '').toLowerCase();
    if (l === 'html' || l === 'htm' || l === 'xhtml') return 'html';
    if (l === 'svg') return 'svg';
    const t = code.trim();
    if (/^<svg[\s>]/i.test(t)) return 'svg';
    if (/^<!doctype\s+html/i.test(t) || /^<html[\s>]/i.test(t)) return 'html';
    return null;
  }
  function mimeForExt(ext) {
    switch (ext.toLowerCase()) {
      case 'html': case 'htm': return 'text/html';
      case 'svg': return 'image/svg+xml';
      case 'xml': return 'application/xml';
      case 'json': return 'application/json';
      case 'css': return 'text/css';
      case 'js': case 'mjs': case 'cjs': return 'text/javascript';
      case 'ts': return 'text/typescript';
      default: return 'text/plain';
    }
  }

  // ===== 复制/下载 =====
  async function copyText(text) {
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text); return true;
      }
    } catch {}
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.top = '-9999px';
    document.body.appendChild(ta); ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch {}
    document.body.removeChild(ta);
    return ok;
  }
  function downloadText(filename, text, mime) {
    const blob = new Blob([text], { type: (mime || 'text/plain') + ';charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  // ===== 运行预览 =====
  let currentRunUrl = null;
  function runCode(code, kind) {
    let html;
    if (kind === 'svg') {
      const t = code.trim();
      if (/^<!doctype\s+html/i.test(t) || /^<html[\s>]/i.test(t)) html = code;
      else html = `<!DOCTYPE html><html><head><meta charset="utf-8">
<style>html,body{margin:0;height:100%;display:flex;align-items:center;justify-content:center;background:#fff;}</style>
</head><body>${code}</body></html>`;
    } else html = code;

    if (currentRunUrl) { URL.revokeObjectURL(currentRunUrl); currentRunUrl = null; }
    currentRunUrl = URL.createObjectURL(new Blob([html], { type: 'text/html;charset=utf-8' }));
    $runTag.textContent = kind.toUpperCase();
    $runFrame.src = currentRunUrl;
    $runModal.classList.add('show');
  }
  function closeRun() {
    $runModal.classList.remove('show');
    $runFrame.src = 'about:blank';
    if (currentRunUrl) { URL.revokeObjectURL(currentRunUrl); currentRunUrl = null; }
  }
  $('run-close').onclick = closeRun;
  $('run-reload').onclick = () => {
    const src = $runFrame.src;
    $runFrame.src = 'about:blank';
    setTimeout(() => { $runFrame.src = src; }, 30);
  };

  // ===== 代码块按钮 =====
  function addCodeActions(container) {
    container.querySelectorAll('pre').forEach(pre => {
      if (pre.querySelector('.code-actions')) return;
      const codeEl = pre.querySelector('code');
      if (!codeEl) return;
      const code = codeEl.textContent || '';
      const lang = detectLang(codeEl);
      const ext = langToExt(lang);
      const kind = detectRunnableKind(lang, code);

      const actions = document.createElement('div');
      actions.className = 'code-actions';

      const copyBtn = document.createElement('button');
      copyBtn.type = 'button'; copyBtn.className = 'code-btn'; copyBtn.textContent = '复制';
      copyBtn.addEventListener('click', async () => {
        const ok = await copyText(codeEl.textContent || '');
        copyBtn.textContent = ok ? '已复制' : '失败';
        copyBtn.classList.add(ok ? 'ok' : 'fail');
        setTimeout(() => { copyBtn.textContent = '复制'; copyBtn.classList.remove('ok', 'fail'); }, 1500);
      });
      actions.appendChild(copyBtn);

      const dlBtn = document.createElement('button');
      dlBtn.type = 'button'; dlBtn.className = 'code-btn'; dlBtn.textContent = '下载';
      dlBtn.title = `下载 .${ext}`;
      dlBtn.addEventListener('click', () => downloadText(`snippet-${tsStamp()}.${ext}`, codeEl.textContent || '', mimeForExt(ext)));
      actions.appendChild(dlBtn);

      if (kind) {
        const runBtn = document.createElement('button');
        runBtn.type = 'button'; runBtn.className = 'code-btn run'; runBtn.textContent = '运行';
        runBtn.addEventListener('click', () => runCode(codeEl.textContent || '', kind));
        actions.appendChild(runBtn);
      }

      pre.appendChild(actions);
    });
  }

  // ===== 系统提示（含剧情引导） =====
  function buildSystemPrompt(conv) {
    const rp = conv.roleplay;
    if (!rp || !rp.enabled) return '';
    const parts = [];
    parts.push(`你现在扮演角色「${rp.name || 'AI 助手'}」，请始终以该角色的身份、语气、性格和知识范围回应。`);
    if (rp.personality) parts.push(`【性格】${rp.personality}`);
    if (rp.style) parts.push(`【说话风格】${rp.style}`);
    if (rp.background) parts.push(`【背景设定】${rp.background}`);
    parts.push(`除非用户明确要求，否则不要跳出角色，不要提及自己是 AI 或语言模型。`);

    const guide = (conv.pendingGuide || '').trim();
    if (guide) {
      parts.push(`【导演指示（本轮有效）】\n${guide}\n请在本次回复中自然融入以上指示，不要直接复述或透露该指示的存在，让剧情自然发展。`);
    }
    return parts.join('\n\n');
  }

  // ===== 剧情引导 UI =====
  function updateGuideUI() {
    const conv = getCurrent();
    const isRP = !!(conv && conv.roleplay && conv.roleplay.enabled);

    if (!isRP) {
      $rpToolbar.style.display = 'none';
      return;
    }

    $rpToolbar.style.display = 'block';
    const guide = (conv.pendingGuide || '').trim();
    if (guide) {
      $guideBanner.style.display = 'flex';
      $rpGuideBtn.style.display = 'none';
      $guideText.textContent = guide.length > 100 ? guide.slice(0, 100) + '…' : guide;
      $guideText.title = guide;
    } else {
      $guideBanner.style.display = 'none';
      $rpGuideBtn.style.display = 'inline-flex';
    }
  }

  function openGuideModal() {
    const conv = getCurrent();
    if (!conv || !conv.roleplay?.enabled) return;
    guideTargetId = conv.id;
    $('guide-input').value = conv.pendingGuide || '';
    $('guide-modal').classList.add('show');
    setTimeout(() => $('guide-input').focus(), 50);
  }

  $rpGuideBtn.onclick = openGuideModal;
  $('guide-edit').onclick = openGuideModal;

  $('guide-clear').onclick = () => {
    const conv = getCurrent();
    if (!conv) return;
    if (!confirm('清除当前剧情引导？')) return;
    conv.pendingGuide = '';
    saveConvs();
    updateGuideUI();
  };

  $('guide-cancel').onclick = () => $('guide-modal').classList.remove('show');

  $('guide-apply').onclick = () => {
    const conv = getById(guideTargetId);
    if (!conv) { $('guide-modal').classList.remove('show'); return; }
    conv.pendingGuide = $('guide-input').value.trim();
    saveConvs();
    $('guide-modal').classList.remove('show');
    if (currentId === guideTargetId) updateGuideUI();
  };

  // ===== 会话管理 =====
  function createConversation(opts = {}) {
    const rp = opts.roleplay || { enabled: false, name: '', personality: '', style: '', background: '' };
    const conv = {
      id: uid(),
      title: rp.enabled && rp.name ? `与 ${rp.name} 的对话` : '新对话',
      createdAt: Date.now(),
      updatedAt: Date.now(),
      model: 'openrouter/free',
      roleplay: { ...rp },
      messages: [],
      pendingGuide: '',
    };
    convs.unshift(conv);
    currentId = conv.id;
    saveConvs(); saveCurrent();
    renderConvList();
    renderCurrent();
    closeSidebar();
    $input.focus();
    return conv;
  }

  function switchConversation(id) {
    if (!getById(id)) return;
    if (id === currentId) { closeSidebar(); return; }
    if (streaming) { try { streaming.abortController.abort(); } catch {} }
    currentId = id;
    userScrolledUp = false;
    saveCurrent();
    renderConvList();
    renderCurrent();
    closeSidebar();
  }

  function deleteConversation(id) {
    const conv = getById(id);
    if (!conv) return;
    if (!confirm(`确定删除对话「${conv.title}」？`)) return;
    if (streaming && streaming.convId === id) { try { streaming.abortController.abort(); } catch {} }
    convs = convs.filter(c => c.id !== id);
    if (currentId === id) { currentId = convs[0]?.id || ''; saveCurrent(); }
    saveConvs();
    renderConvList();
    renderCurrent();
  }

  function resetConversation(id) {
    const conv = getById(id);
    if (!conv) return;
    if (!confirm(`清空「${conv.title}」的所有聊天记录？\n角色设定、标题、模型、剧情引导保持不变。`)) return;
    if (streaming && streaming.convId === id) { try { streaming.abortController.abort(); } catch {} }
    conv.messages = [];
    conv.updatedAt = Date.now();
    saveConvs();
    if (conv.id === currentId) renderCurrent();
  }

  function exportConversation(conv) {
    if (!conv) return;
    const lines = [`# ${conv.title}`, ''];
    lines.push(`> 模型: ${conv.model}`);
    if (conv.roleplay?.enabled) {
      lines.push(`> 角色扮演: ${conv.roleplay.name || 'AI'}`);
      if (conv.roleplay.personality) lines.push(`> 性格: ${conv.roleplay.personality}`);
      if (conv.roleplay.style) lines.push(`> 说话风格: ${conv.roleplay.style}`);
      if (conv.roleplay.background) lines.push(`> 背景设定: ${conv.roleplay.background}`);
    }
    lines.push('', '---', '');
    conv.messages.forEach(m => {
      lines.push(m.role === 'user' ? '## 👤 用户' : '## 🤖 助手');
      lines.push('', m.content, '');
    });
    downloadText(`${conv.title.replace(/[\\/:*?"<>|]/g, '_')}-${tsStamp()}.md`, lines.join('\n'), 'text/markdown');
  }

  // ===== 渲染列表 =====
  function renderConvList() {
    const normal = convs.filter(c => !c.roleplay?.enabled);
    const roleplay = convs.filter(c => c.roleplay?.enabled);

    if (normal.length === 0 && roleplay.length === 0) {

  function makeConvItem(conv) {

    item.dataset.id = conv.id;

  // ===== 通用浮动菜单 =====
  function closeFloatingMenu() {
    if (floatingMenu) { floatingMenu.remove(); floatingMenu = null; }
    document.removeEventListener('mousedown', onFloatOutside, true);
    document.removeEventListener('touchstart', onFloatOutside, true);
  }
  function onFloatOutside(e) {
    if (floatingMenu && !floatingMenu.contains(e.target)) closeFloatingMenu();
  }
  function positionMenu(menu, x, y) {
    document.body.appendChild(menu);
    const rect = menu.getBoundingClientRect();
    const W = window.innerWidth, H = window.innerHeight;
    let left = x - rect.width / 2;
    let top = y + 8;
    if (left < 8) left = 8;
    if (left + rect.width > W - 8) left = W - rect.width - 8;
    if (top + rect.height > H - 8) top = y - rect.height - 8;
    if (top < 8) top = 8;
    menu.style.left = left + 'px';
    menu.style.top = top + 'px';
  }
  function bindFloatOutside() {
    setTimeout(() => {
      document.addEventListener('mousedown', onFloatOutside, true);
      document.addEventListener('touchstart', onFloatOutside, true);
    }, 0);
  }

  // ===== 会话菜单 =====
  function showConvMenu(id, anchorEl) {
    closeFloatingMenu();
    const conv = getById(id);
    if (!conv) return;

    const isRoleplay = !!conv.roleplay?.enabled;
    const menu = document.createElement('div');
    menu.className = 'floating-menu';

    const items = [];
    if (isRoleplay) {
      items.push({ a: 'edit-title', label: '编辑标题' });
      items.push({ a: 'edit-roleplay', label: '编辑人设' });
    } else {
      items.push({ a: 'edit-title', label: '重命名' });
    }
    items.push({ a: 'reset', label: '重置对话' });
    items.push({ a: 'export', label: '导出 Markdown' });
    items.push({ a: 'delete', label: '删除', cls: 'danger' });

    items.forEach(it => {
      const btn = document.createElement('button');
      btn.textContent = it.label;
      if (it.cls) btn.className = it.cls;
      btn.addEventListener('click', () => {
        closeFloatingMenu();
        if (it.a === 'edit-title') {
          const t = prompt('输入新标题', conv.title);
          if (t !== null) {
            conv.title = t.trim() || conv.title;
            saveConvs(); renderConvList();
            if (conv.id === currentId) $convTitle.textContent = conv.title;
          }
        } else if (it.a === 'edit-roleplay') {
          openConvSettings(conv.id);
        } else if (it.a === 'reset') {
          resetConversation(conv.id);
        } else if (it.a === 'export') {
          exportConversation(conv);
        } else if (it.a === 'delete') {
          deleteConversation(conv.id);
        }
      });
      menu.appendChild(btn);
    });

    const rect = anchorEl.getBoundingClientRect();
    positionMenu(menu, rect.left + rect.width / 2, rect.bottom);
    floatingMenu = menu;
    bindFloatOutside();
  }

  // ===== 消息菜单 =====
  function showMsgMenu(msgWrap, msg, x, y) {
    if (streaming) return;
    closeFloatingMenu();
    const conv = getCurrent();
    if (!conv) return;
    const idx = conv.messages.indexOf(msg);
    if (idx < 0) return;

    const isLast = idx === conv.messages.length - 1;
    const isLastAssistant = isLast && msg.role === 'assistant';

    const menu = document.createElement('div');
    menu.className = 'floating-menu';

    const editBtn = document.createElement('button');
    editBtn.textContent = '修改';
    editBtn.addEventListener('click', () => {
      closeFloatingMenu();
      openEditMsg(conv.id, idx);
    });
    menu.appendChild(editBtn);

    if (isLastAssistant) {
      const regenBtn = document.createElement('button');
      regenBtn.textContent = '重新生成';
      regenBtn.addEventListener('click', () => {
        closeFloatingMenu();
        regenerate(idx);
      });
      menu.appendChild(regenBtn);
    }

    const delBtn = document.createElement('button');
    delBtn.className = 'danger';
    delBtn.textContent = '删除';
    delBtn.addEventListener('click', () => {
      closeFloatingMenu();
      if (!confirm('删除此消息及之后的所有消息？')) return;
      conv.messages.splice(idx);
      conv.updatedAt = Date.now();
      saveConvs();
      renderCurrent();
    });
    menu.appendChild(delBtn);

    positionMenu(menu, x, y);
    floatingMenu = menu;
    bindFloatOutside();
  }

  // ===== 消息交互绑定 =====
  function attachMsgInteractions(wrap, msg) {
    const trigger = document.createElement('button');
    trigger.className = 'msg-trigger';
    trigger.type = 'button';
    trigger.textContent = '⋯';
    trigger.title = '更多操作';
    trigger.addEventListener('click', e => {
      e.stopPropagation();
      const rect = trigger.getBoundingClientRect();
      showMsgMenu(wrap, msg, rect.left + rect.width / 2, rect.bottom + 4);
    });
    wrap.appendChild(trigger);

    let timer = null, startX = 0, startY = 0, fired = false;
    const cancelTimer = () => { if (timer) { clearTimeout(timer); timer = null; } };

    wrap.addEventListener('touchstart', e => {
      if (e.target.closest('pre, code, a, .code-actions, .msg-trigger')) return;
      fired = false;
      const t = e.touches[0];
      startX = t.clientX; startY = t.clientY;
      cancelTimer();
      timer = setTimeout(() => {
        fired = true;
        if (navigator.vibrate) { try { navigator.vibrate(15); } catch {} }
        showMsgMenu(wrap, msg, startX, startY);
      }, 500);
    }, { passive: true });

    wrap.addEventListener('touchmove', e => {
      if (!timer) return;
      const t = e.touches[0];
      if (Math.abs(t.clientX - startX) > 10 || Math.abs(t.clientY - startY) > 10) cancelTimer();
    }, { passive: true });

    wrap.addEventListener('touchend', e => {
      cancelTimer();
      if (fired) { e.preventDefault(); fired = false; }
    });
    wrap.addEventListener('touchcancel', cancelTimer);

    wrap.addEventListener('contextmenu', e => {
      if (e.target.closest('pre, code, a')) return;
      e.preventDefault();
      showMsgMenu(wrap, msg, e.clientX, e.clientY);
    });
  }

  $('edit-msg-save').onclick = async () => {

        renderCurrent();

  function appendMessageDOM(msg) {

  // ===== 重新生成 =====
  async function regenerate(fromIdx) {
    const conv = getCurrent();
    if (!conv || streaming) return;
    if (fromIdx !== conv.messages.length - 1) return;
    if (conv.messages[fromIdx]?.role !== 'assistant') return;

    conv.messages.splice(fromIdx);
    conv.updatedAt = Date.now();
    saveConvs();
    renderCurrent();

    if (conv.messages[conv.messages.length - 1]?.role !== 'user') return;
    await generateAssistant(conv);
  }

  // ===== 生成 =====
  async function generateAssistant(conv) {
    if (!apiKey) { alert('请先在设置里填入 API Key'); openGlobalSettings(); return; }
    if (streaming) return;

    const myConvId = conv.id;
    userScrolledUp = false;

    const wrap = document.createElement('div');
    wrap.className = 'msg-wrap assistant';
    const assistantDiv = document.createElement('div');
    assistantDiv.className = 'msg assistant';
    const label = document.createElement('div');
    label.className = 'label'; label.textContent = '助手';
    assistantDiv.appendChild(label);
    const contentEl = document.createElement('div');
    contentEl.className = 'md streaming';
    assistantDiv.appendChild(contentEl);
    wrap.appendChild(assistantDiv);
    $messages.appendChild(wrap);
    scrollBottom(true);

    const renderer = makeRenderer(contentEl);
    const abortController = new AbortController();
    streaming = { convId: myConvId, assistantDiv, contentEl, renderer, abortController, msgWrap: wrap };
    setStreamingUI(true);

    let wasAborted = false;

    try {
      const sys = buildSystemPrompt(conv);
      const messagesForAPI = [];
      if (sys) messagesForAPI.push({ role: 'system', content: sys });
      messagesForAPI.push(...conv.messages);

      const body = {
        model: conv.model || 'openrouter/free',
        messages: messagesForAPI,
        stream: true,
        temperature: settings.temperature ?? 0.7,
      };
      if (settings.maxTokens > 0) body.max_tokens = settings.maxTokens;

      const response = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${apiKey}`, 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
        signal: abortController.signal,
      });

      if (!response.ok) {
        const errText = await response.text();
        throw new Error(`HTTP ${response.status}: ${errText.slice(0, 300)}`);
      }

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        let idx;
        while ((idx = buffer.indexOf('\n')) !== -1) {
          const line = buffer.slice(0, idx).trim();
          buffer = buffer.slice(idx + 1);
          if (!line || line.startsWith(':')) continue;
          if (!line.startsWith('data: ')) continue;
          const data = line.slice(6);
          if (data === '[DONE]') continue;
          try {
            const parsed = JSON.parse(data);
            const delta = parsed.choices?.[0]?.delta?.content;
            if (delta) {
              renderer.setText(renderer.text + delta);
              renderer.schedule();
            }
          } catch {}
        }
      }
    } catch (err) {
      if (err.name === 'AbortError') {
        wasAborted = true;
      } else {
        assistantDiv.classList.add('error');
        contentEl.textContent = `请求失败：${err.message}`;
      }
    } finally {
      contentEl.classList.remove('streaming');
      const targetConv = getById(myConvId);
      if (renderer.text && targetConv) {
        renderer.flush();
        addCodeActions(contentEl);
        highlightAll(contentEl);
        let finalContent = renderer.text;
        if (wasAborted) finalContent += '\n\n*（已停止）*';
        const newMsg = { role: 'assistant', content: finalContent };
        targetConv.messages.push(newMsg);
        targetConv.updatedAt = Date.now();

        // 成功完成时消费掉剧情引导（中止则保留）
        if (!wasAborted && targetConv.pendingGuide) {
          targetConv.pendingGuide = '';
          if (currentId === myConvId) updateGuideUI();
        }

        saveConvs();
        if (currentId === myConvId) {
          attachMsgInteractions(wrap, newMsg);
        }
      } else if (!renderer.text) {
        wrap.remove();
      }
      streaming = null;
      setStreamingUI(false);
      $input.focus();
    }
  }

  // ===== 发送 =====
  async function send() {
    const conv = getCurrent();
    if (!conv || streaming) return;
    if (!apiKey) { alert('请先在设置里填入 API Key'); openGlobalSettings(); return; }

    const text = $input.value.trim();
    if (!text) return;

    $input.value = '';
    $input.style.height = '44px';
    $input.focus();

    const newMsg = { role: 'user', content: text };
    conv.messages.push(newMsg);
    conv.updatedAt = Date.now();
    if (conv.title === '新对话') {
      conv.title = text.slice(0, 24) + (text.length > 24 ? '…' : '');
      $convTitle.textContent = conv.title;
    }
    saveConvs();
    renderConvList();
    appendMessageDOM(newMsg);
    scrollBottom(true);

    await generateAssistant(conv);
  }

  // ===== 流式渲染器 =====
  function makeRenderer(contentEl) {
    let last = 0, timer = null, full = '';
    const doRender = () => { renderMarkdown(contentEl, full); scrollBottom(); };
    return {
      setText(t) { full = t; },
      schedule() {
        const now = performance.now();
        const remain = RENDER_INTERVAL - (now - last);
        if (remain <= 0) {
          if (timer) { clearTimeout(timer); timer = null; }
          last = now; doRender();
        } else if (!timer) {
          timer = setTimeout(() => { timer = null; last = performance.now(); doRender(); }, remain);
        }
      },
      flush() { if (timer) { clearTimeout(timer); timer = null; } doRender(); },
      get text() { return full; },
    };
  }

  function setStreamingUI(on) {
    $sendBtn.disabled = on;
    $sendBtn.textContent = on ? '停止' : '发送';
    $sendBtn.onclick = on ? () => streaming?.abortController.abort() : send;
  }

  let resizing = false;
  $sidebarResizer.addEventListener('mousedown', e => {

    e.preventDefault();
    resizing = true;
    $sidebarResizer.classList.add('dragging');
    document.body.classList.add('resizing');
  });
  document.addEventListener('mousemove', e => {
    if (!resizing) return;
    const w = Math.max(200, Math.min(480, e.clientX));

  document.addEventListener('mouseup', () => {

    document.body.classList.remove('resizing');
    const w = parseInt($sidebar.style.width, 10);
    if (w) localStorage.setItem(LS.SIDEBAR_W, String(w));
  });

  // ===== 顶部按钮 =====
  $('new-chat-btn').onclick = openNewChat;
  $('settings-btn').onclick = openGlobalSettings;
  $('conv-settings-btn').onclick = () => {
    const conv = getCurrent();
    if (!conv) { alert('请先新建对话'); return; }
    openConvSettings(conv.id);
  };
  $model.addEventListener('change', () => {
    const conv = getCurrent();
    if (conv) { conv.model = $model.value; saveConvs(); }
  });

  // ===== 输入 =====
  $input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      if (!$sendBtn.disabled) send();
    }
  });
  $input.addEventListener('input', () => {
    $input.style.height = 'auto';
    $input.style.height = Math.min($input.scrollHeight, 120) + 'px';
  });
  $sendBtn.onclick = send;

  // ===== ESC 关闭所有模态框 =====
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if ($runModal.classList.contains('show')) { closeRun(); return; }
    if ($('guide-modal').classList.contains('show')) { $('guide-modal').classList.remove('show'); return; }
    if ($('edit-msg-modal').classList.contains('show')) {
      $('edit-msg-modal').classList.remove('show');
      editMsgTarget = null;
      return;
    }
    if ($('conv-settings-modal').classList.contains('show')) { $('conv-settings-modal').classList.remove('show'); return; }
    if ($('new-chat-modal').classList.contains('show')) { $('new-chat-modal').classList.remove('show'); return; }
    if ($('global-settings-modal').classList.contains('show')) { $('global-settings-modal').classList.remove('show'); return; }
  });

  // ===== 初始化 =====
  loadAll();
  if (!currentId || !getById(currentId)) {
    if (convs.length > 0) currentId = convs[0].id;
  }
  renderConvList();
  renderCurrent();
  saveCurrent();
  if (!apiKey) setTimeout(openGlobalSettings, 300);
  else $input.focus();
})();
</script>
</body>
</html>
