<!-- ===== iOS 图标运行时生成 ===== -->
<script>
(function () {
  function rr(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function draw(size, padRatio) {
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const ctx = c.getContext('2d');
    const pad = size * (padRatio || 0);
    const inner = size - pad * 2;
    const s = inner / 128;

    ctx.fillStyle = '#151821';
    ctx.fillRect(0, 0, size, size);

    ctx.save();
    ctx.translate(pad, pad);
    const g = ctx.createLinearGradient(0, 0, inner, inner);
    g.addColorStop(0, '#6f9bff');
    g.addColorStop(1, '#4f7cff');

    rr(ctx, 24 * s, 34 * s, 80 * s, 52 * s, 14 * s);
    ctx.fillStyle = g;
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(52 * s, 86 * s);
    ctx.lineTo(52 * s, 104 * s);
    ctx.lineTo(74 * s, 86 * s);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#fff';
    for (const x of [48, 64, 80]) {
      ctx.beginPath();
      ctx.arc(x * s, 60 * s, 6 * s, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
    return c.toDataURL('image/png');
  }

  const png180 = draw(180, 0);
  const png192 = draw(192, 0.08);
  const png512 = draw(512, 0.08);

  const head = document.head;
  const add = (rel, href, sizes) => {
    const l = document.createElement('link');
    l.rel = rel;
    if (sizes) l.sizes = sizes;
    l.href = href;
    head.appendChild(l);
  };
  add('apple-touch-icon', png180, '180x180');
  add('icon', png192, '192x192');

  const manifest = {
    name: 'AI 聊天',
    short_name: 'AI 聊天',
    start_url: location.href,
    scope: location.href.replace(/[^/]*$/, ''),
    display: 'standalone',
    background_color: '#0f1117',
    theme_color: '#151821',
    icons: [
      { src: png192, sizes: '192x192', type: 'image/png', purpose: 'any' },
      { src: png512, sizes: '512x512', type: 'image/png', purpose: 'any' }
    ]
  };
  const mUrl = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' }));
  add('manifest', mUrl);
})();
</script>

      <pre><code class="language-html">&lt;!DOCTYPE html&gt;

<script>
(() => {
  const $messages = document.getElementById('messages');
  const $input = document.getElementById('input');
  const $sendBtn = document.getElementById('send-btn');
  const $apiKey = document.getElementById('api-key');
  const $model = document.getElementById('model');
  const $runModal = document.getElementById('run-modal');
  const $runFrame = document.getElementById('run-frame');
  const $runTag = document.getElementById('run-tag');

  const API_URL = 'https://openrouter.ai/api/v1/chat/completions';
  const RENDER_INTERVAL = 80;

  let history = [];
  let abortController = null;
  let currentRunUrl = null;

  // ============ Markdown ============
  if (window.marked) marked.setOptions({ gfm: true, breaks: true });

  function renderMarkdown(container, text) {
    if (!window.marked) { container.textContent = text; return; }
    const html = marked.parse(text);
    const safe = window.DOMPurify
      ? DOMPurify.sanitize(html, { ADD_ATTR: ['target'] })
      : html;
    container.innerHTML = safe;

    container.querySelectorAll('a').forEach(a => {
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
    });
  }

  function highlightAll(container) {
    if (!window.hljs) return;
    container.querySelectorAll('pre code').forEach(el => {
      try {
        delete el.dataset.highlighted;
        hljs.highlightElement(el);
      } catch (_) {}
    });
  }

  // ============ 语言 / 后缀检测 ============
  const EXT_MAP = {
    python: 'py', py: 'py', python3: 'py',
    javascript: 'js', js: 'js', jsx: 'jsx', node: 'js', nodejs: 'js', mjs: 'mjs', cjs: 'cjs',
    typescript: 'ts', ts: 'ts', tsx: 'tsx',
    html: 'html', htm: 'html', xhtml: 'xhtml',
    css: 'css', scss: 'scss', sass: 'sass', less: 'less',
    svg: 'svg', xml: 'xml',
    json: 'json', json5: 'json5', jsonc: 'jsonc',
    yaml: 'yml', yml: 'yml',
    markdown: 'md', md: 'md',
    shell: 'sh', sh: 'sh', bash: 'sh', zsh: 'sh', fish: 'fish',
    powershell: 'ps1', ps1: 'ps1', pwsh: 'ps1',
    cmd: 'bat', bat: 'bat', batch: 'bat',
    c: 'c', h: 'h',
    cpp: 'cpp', 'c++': 'cpp', cc: 'cpp', cxx: 'cpp', hpp: 'hpp',
    csharp: 'cs', cs: 'cs', 'c#': 'cs',
    java: 'java',
    kotlin: 'kt', kt: 'kt', kts: 'kts',
    go: 'go', golang: 'go',
    rust: 'rs', rs: 'rs',
    ruby: 'rb', rb: 'rb',
    php: 'php',
    swift: 'swift',
    dart: 'dart',
    scala: 'scala',
    lua: 'lua',
    r: 'r',
    sql: 'sql',
    perl: 'pl', pl: 'pl',
    elixir: 'ex', ex: 'ex', exs: 'exs',
    erlang: 'erl', erl: 'erl',
    haskell: 'hs', hs: 'hs',
    clojure: 'clj', clj: 'clj', cljs: 'cljs',
    dockerfile: 'Dockerfile', docker: 'Dockerfile',
    makefile: 'Makefile', make: 'Makefile',
    nginx: 'conf', ini: 'ini', toml: 'toml', conf: 'conf', env: 'env',
    plaintext: 'txt', text: 'txt', txt: 'txt', plain: 'txt',
  };

  function detectLang(codeEl) {
    const cls = codeEl.className || '';
    let m = cls.match(/(?:^|\s)language-([\w+#.\-]+)/i);
    if (m) return m[1].toLowerCase();
    m = cls.match(/(?:^|\s)lang-([\w+#.\-]+)/i);
    if (m) return m[1].toLowerCase();
    if (codeEl.result && codeEl.result.language) return codeEl.result.language.toLowerCase();
    return '';
  }

  function langToExt(lang) {
    if (!lang) return 'txt';
    return EXT_MAP[lang] || lang.replace(/[^\w+#\-]/g, '');
  }

  function detectRunnableKind(lang, code) {
    const l = (lang || '').toLowerCase();
    if (l === 'html' || l === 'htm' || l === 'xhtml') return 'html';
    if (l === 'svg') return 'svg';
    const t = code.trim();
    if (/^<svg[\s>]/i.test(t)) return 'svg';
    if (/^<!doctype\s+html/i.test(t) || /^<html[\s>]/i.test(t)) return 'html';
    return null;
  }

  // ============ 文件工具 ============
  function tsStamp() {
    const d = new Date();
    const p = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
  }

  function mimeForExt(ext) {
    switch (ext.toLowerCase()) {
      case 'html': case 'htm': return 'text/html';
      case 'svg': return 'image/svg+xml';
      case 'xml': return 'application/xml';
      case 'json': return 'application/json';
      case 'css': return 'text/css';
      case 'js': case 'mjs': case 'cjs': return 'text/javascript';
      case 'ts': return 'text/typescript';
      default: return 'text/plain';
    }
  }

  async function copyText(text) {
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        return true;
      }
    } catch (_) {}
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.top = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (_) {}
    document.body.removeChild(ta);
    return ok;
  }

  function downloadText(filename, text, mime) {
    const blob = new Blob([text], { type: (mime || 'text/plain') + ';charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  // ============ 运行（仅 html / svg） ============
  function runCode(code, kind) {
    let html;
    if (kind === 'svg') {
      const t = code.trim();
      if (/^<!doctype\s+html/i.test(t) || /^<html[\s>]/i.test(t)) {
        html = code;
      } else {
        html = `<!DOCTYPE html><html><head><meta charset="utf-8">
<style>html,body{margin:0;height:100%;display:flex;align-items:center;justify-content:center;background:#fff;}</style>
</head><body>${code}</body></html>`;
      }
    } else {
      html = code;
    }

    if (currentRunUrl) {
      URL.revokeObjectURL(currentRunUrl);
      currentRunUrl = null;
    }
    const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
    currentRunUrl = URL.createObjectURL(blob);

    $runTag.textContent = kind.toUpperCase();
    $runFrame.src = currentRunUrl;
    $runModal.classList.add('show');
  }

  function closeRun() {
    $runModal.classList.remove('show');
    $runFrame.src = 'about:blank';
    if (currentRunUrl) {
      URL.revokeObjectURL(currentRunUrl);
      currentRunUrl = null;
    }
  }

  document.getElementById('run-close').onclick = closeRun;
  document.getElementById('run-reload').onclick = () => {
    const src = $runFrame.src;
    $runFrame.src = 'about:blank';
    setTimeout(() => { $runFrame.src = src; }, 30);
  };
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && $runModal.classList.contains('show')) closeRun();
  });

  // ============ 代码块按钮 ============
  function addCodeActions(container) {
    container.querySelectorAll('pre').forEach(pre => {
      if (pre.querySelector('.code-actions')) return;
      const codeEl = pre.querySelector('code');
      if (!codeEl) return;

      const code = codeEl.textContent;
      const lang = detectLang(codeEl);
      const ext = langToExt(lang);
      const kind = detectRunnableKind(lang, code);

      const actions = document.createElement('div');
      actions.className = 'code-actions';

      // 复制
      const copyBtn = document.createElement('button');
      copyBtn.type = 'button';
      copyBtn.className = 'code-btn';
      copyBtn.textContent = '复制';
      copyBtn.title = '复制代码';
      copyBtn.addEventListener('click', async () => {
        const ok = await copyText(codeEl.textContent);
        copyBtn.textContent = ok ? '已复制' : '失败';
        copyBtn.classList.add(ok ? 'ok' : 'fail');
        setTimeout(() => {
          copyBtn.textContent = '复制';
          copyBtn.classList.remove('ok', 'fail');
        }, 1500);
      });
      actions.appendChild(copyBtn);

      // 下载
      const dlBtn = document.createElement('button');
      dlBtn.type = 'button';
      dlBtn.className = 'code-btn';
      dlBtn.textContent = '下载';
      dlBtn.title = `下载 .${ext}`;
      dlBtn.addEventListener('click', () => {
        downloadText(`snippet-${tsStamp()}.${ext}`, codeEl.textContent, mimeForExt(ext));
      });
      actions.appendChild(dlBtn);

      // 运行（仅 html / svg）
      if (kind) {
        const runBtn = document.createElement('button');
        runBtn.type = 'button';
        runBtn.className = 'code-btn run';
        runBtn.textContent = '运行';
        runBtn.title = `在沙盒中运行 ${kind.toUpperCase()}`;
        runBtn.addEventListener('click', () => runCode(codeEl.textContent, kind));
        actions.appendChild(runBtn);
      }

      pre.appendChild(actions);
    });
  }

  // ============ 消息渲染 ============
  function scrollBottom() {
    $messages.scrollTop = $messages.scrollHeight;
  }

  function addMessage(role, content = '') {
    const div = document.createElement('div');
    div.className = `msg ${role}`;

    if (role === 'assistant') {
      const label = document.createElement('div');
      label.className = 'label';
      label.textContent = '助手';
      div.appendChild(label);

      const md = document.createElement('div');
      md.className = 'md';
      div.appendChild(md);
      $messages.appendChild(div);
      if (content) renderMarkdown(md, content);
      scrollBottom();
      return { div, contentEl: md };
    }

    div.textContent = content;
    $messages.appendChild(div);
    scrollBottom();
    return { div, contentEl: div };
  }

  function setStreaming(streaming) {
    $sendBtn.disabled = streaming;
    $sendBtn.textContent = streaming ? '停止' : '发送';
    $sendBtn.onclick = streaming ? () => abortController?.abort() : send;
  }

  // ============ 流式节流渲染 ============
  function makeRenderer(contentEl) {
    let last = 0;
    let timer = null;
    let full = '';
    const doRender = () => {
      renderMarkdown(contentEl, full);
      scrollBottom();
    };
    return {
      setText(t) { full = t; },
      schedule() {
        const now = performance.now();
        const remain = RENDER_INTERVAL - (now - last);
        if (remain <= 0) {
          if (timer) { clearTimeout(timer); timer = null; }
          last = now;
          doRender();
        } else if (!timer) {
          timer = setTimeout(() => {
            timer = null;
            last = performance.now();
            doRender();
          }, remain);
        }
      },
      flush() {
        if (timer) { clearTimeout(timer); timer = null; }
        doRender();
      },
      get text() { return full; }
    };
  }

  // ============ 发送 ============
  async function send() {
    const key = $apiKey.value.trim();
    if (!key) { alert('请先填入 OpenRouter API Key'); return; }
    const text = $input.value.trim();
    if (!text) return;

    const model = $model.value;
    $input.value = '';
    $input.style.height = '44px';

    history.push({ role: 'user', content: text });
    addMessage('user', text);
    $input.focus();

    const { div: assistantDiv, contentEl } = addMessage('assistant');
    contentEl.classList.add('streaming');

    const renderer = makeRenderer(contentEl);
    setStreaming(true);
    abortController = new AbortController();

    try {
      const response = await fetch(API_URL, {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${key}`,
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({ model, messages: history, stream: true }),
        signal: abortController.signal,
      });

      if (!response.ok) {
        const errText = await response.text();
        throw new Error(`HTTP ${response.status}: ${errText.slice(0, 300)}`);
      }

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });

        let idx;
        while ((idx = buffer.indexOf('\n')) !== -1) {
          const line = buffer.slice(0, idx).trim();
          buffer = buffer.slice(idx + 1);
          if (!line || line.startsWith(':')) continue;
          if (!line.startsWith('data: ')) continue;
          const data = line.slice(6);
          if (data === '[DONE]') continue;

          try {
            const parsed = JSON.parse(data);
            const delta = parsed.choices?.[0]?.delta?.content;
            if (delta) {
              renderer.setText(renderer.text + delta);
              renderer.schedule();
            }
          } catch (_) {}
        }
      }
    } catch (err) {
      if (err.name === 'AbortError') {
        if (renderer.text) {
          renderer.setText(renderer.text + '\n\n*（已停止）*');
          renderer.flush();
        } else {
          assistantDiv.remove();
        }
      } else {
        assistantDiv.classList.add('error');
        contentEl.textContent = `请求失败：${err.message}`;
      }
    } finally {
      contentEl.classList.remove('streaming');
      if (renderer.text) {
        renderer.flush();
        addCodeActions(contentEl);   // 先加按钮（此时 language-xxx 还在）
        highlightAll(contentEl);     // 再高亮（hljs 会移除 class）
        history.push({ role: 'assistant', content: renderer.text });
      }
      setStreaming(false);
      abortController = null;
      $input.focus();
    }
  }

  // ============ 输入交互 ============
  $input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      if (!$sendBtn.disabled) send();
    }
  });
  $input.addEventListener('input', () => {
    $input.style.height = 'auto';
    $input.style.height = Math.min($input.scrollHeight, 120) + 'px';
  });
  $sendBtn.onclick = send;

  // 初始化静态消息
  document.querySelectorAll('.md').forEach(md => {
    addCodeActions(md);
    highlightAll(md);
  });

  if (!$apiKey.value) $apiKey.focus();
})();
</script>
</body>
</html>
